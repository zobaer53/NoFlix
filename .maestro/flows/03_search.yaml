# Search tab shows Discover; typing a query shows paged results; a result opens details.
appId: com.zobaer53.zedmovies
name: 03_search
---
- launchApp
- extendedWaitUntil:
    visible: "Upcoming Movies"
    timeout: 30000
- tapOn: "Search"
- extendedWaitUntil:
    visible: "Discover"
    timeout: 20000
- tapOn: "search place holder"
- inputText: "Batman"
- hideKeyboard
- extendedWaitUntil:
    visible: "Batman Begins"
    timeout: 20000
- takeScreenshot: search
# First result's poster (the search field also contains "Batman").
- tapOn:
    text: "Rating"
    below: "Tv Shows"
    index: 0
- extendedWaitUntil:
    visible: "Overview"
    timeout: 20000
- back
