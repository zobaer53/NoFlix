
plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.hilt)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.ksp)
    alias(libs.plugins.room)
    alias(libs.plugins.kotlin.serialization)
}


android {
    namespace 'com.zobaer53.zedmovies'
    compileSdk libs.versions.compileSdk.get().toInteger()

    defaultConfig {
        applicationId "com.zobaer53.zedmovies"
        minSdk 26
        targetSdk 37
        // CI passes -PappVersionCode/-PappVersionName (see .github/workflows/release.yml).
        // To start a new minor/major line, raise versionName here; CI releases it next.
        versionCode project.hasProperty("appVersionCode") ? project.property("appVersionCode").toInteger() : 3
        versionName project.findProperty("appVersionName") ?: "3.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
        Properties properties = new Properties()
        properties.load(project.rootProject.file("local.properties").newDataInputStream())
        buildConfigField "String","API_KEY","\"${properties.getProperty("API_KEY")}\""
    }

    signingConfigs {
        release {
            Properties signing = new Properties()
            signing.load(project.rootProject.file("local.properties").newDataInputStream())
            if (signing.getProperty("RELEASE_STORE_FILE") != null) {
                storeFile file(signing.getProperty("RELEASE_STORE_FILE"))
                storePassword signing.getProperty("RELEASE_STORE_PASSWORD")
                keyAlias signing.getProperty("RELEASE_KEY_ALIAS")
                keyPassword signing.getProperty("RELEASE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}


room {
    // Exported schemas are committed so schema changes can get tested migrations.
    schemaDirectory "$projectDir/schemas"
}

