# Builds a signed release APK for every push to master (including merged pull
# requests) and publishes it as a GitHub release.
#
# Versioning: the next version is the latest X.Y.Z tag with the patch number
# bumped (2.1.0 -> 2.1.1). To start a new minor/major line, raise versionName in
# app/build.gradle above the latest tag (e.g. "2.2.0") and that version is used
# as is. versionCode is derived from the version (X*10000 + Y*100 + Z), so it
# always increases and installs update over older releases.
#
# Required repository secrets: API_KEY, RELEASE_KEYSTORE_BASE64,
# RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD.
name: Release

on:
  push:
    branches: [master]
    # Website and docs-only changes don't need a new APK.
    paths-ignore:
      - 'docs/**'
      - 'tools/**'
      - '**.md'
  workflow_dispatch:

# Two releases built at once could pick the same version number.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags are needed to work out the next version

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # Caches Gradle and validates the wrapper jar.
      - uses: gradle/actions/setup-gradle@v6

      # Versions match gradle/libs.versions.toml (compileSdk, ndk, cmake) and AGP's build tools.
      - name: Install SDK platform, NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-37.0" "build-tools;36.0.0" \
            "ndk;28.2.13676358" "cmake;3.22.1" > /dev/null

      - name: Work out version
        id: version
        run: |
          base=$(sed -n 's/.*?: "\([0-9]*\.[0-9]*\.[0-9]*\)".*/\1/p' app/build.gradle | head -1)
          latest=$(git tag --list '[0-9]*' | sort -V | tail -1)
          if [ -z "$latest" ] || [ "$(printf '%s\n%s\n' "$latest" "$base" | sort -V | tail -1)" != "$latest" ]; then
            version=$base
          else
            IFS=. read -r major minor patch <<< "$latest"
            version="$major.${minor:-0}.$(( ${patch:-0} + 1 ))"
          fi
          IFS=. read -r major minor patch <<< "$version"
          code=$(( major * 10000 + minor * 100 + patch ))
          echo "Releasing $version (versionCode $code), latest tag was ${latest:-none}"
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Set up signing and API key
        env:
          API_KEY: ${{ secrets.API_KEY }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "API_KEY=$API_KEY"
            echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks"
            echo "RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
          } > local.properties

      - name: Build release APK
        run: |
          ./gradlew :app:assembleRelease \
            -PappVersionCode=${{ steps.version.outputs.code }} \
            -PappVersionName=${{ steps.version.outputs.name }}

      - name: Check the APK is signed with the release key
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk" | grep -q "CN=zeD, O=NoFlix"
          cp "$apk" NoFlix.apk

      # Android 15+ devices with 16 KB memory pages need 16 KB-aligned native libraries;
      # otherwise the app runs in compat mode and shows a warning.
      - name: Check 16 KB page-size alignment
        run: |
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$tools/zipalign" -c -P 16 -v 4 NoFlix.apk > /dev/null
          objdump=$(ls "$ANDROID_HOME"/ndk/28.2.13676358/toolchains/llvm/prebuilt/*/bin/llvm-objdump)
          libs=$(mktemp -d)
          unzip -q NoFlix.apk 'lib/arm64-v8a/*' 'lib/x86_64/*' -d "$libs"
          for so in "$libs"/lib/*/*.so; do
            if "$objdump" -p "$so" | grep LOAD | grep -qv 'align 2\*\*1[4-9]'; then
              echo "::error::${so#$libs/} is not 16 KB aligned"; exit 1
            fi
          done

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.name }}" NoFlix.apk \
            --target "$GITHUB_SHA" \
            --title "v${{ steps.version.outputs.name }}" \
            --generate-notes
